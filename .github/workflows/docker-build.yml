name: Build and Push Docker Image

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ai8future/airborne
  PRICING_DB_REF: b7cf0ec4e2f5ccae0ee5bb7545a137777e4b2c24
  CHASSIS_GO_REF: 8601951558c28bb23081af0d5207af7567f607b8
  CHASSIS_GO_ADDONS_REF: 9bdb354cb37cd4935609444bbec532f5db25e48e

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout pricing_db
        uses: actions/checkout@v4
        with:
          repository: ai8future/pricing_db
          ref: ${{ env.PRICING_DB_REF }}
          path: pricing_db
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout chassis-go
        uses: actions/checkout@v4
        with:
          repository: ai8future/chassis-go
          ref: ${{ env.CHASSIS_GO_REF }}
          path: chassis_suite/chassis-go
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout chassis-go-addons
        uses: actions/checkout@v4
        with:
          repository: ai8future/chassis-go-addons
          ref: ${{ env.CHASSIS_GO_ADDONS_REF }}
          path: chassis_suite/chassis-go-addons
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read VERSION file
        id: version
        run: |
          if [ -f VERSION ]; then
            echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
          fi

      - name: Set build time
        id: build_time
        run: echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            type=sha,prefix=
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.build_time.outputs.build_time }}
          no-cache: true
