# Isolated deterministic topology. All image values are explicit so CI can pin digests.
name: ${COMPOSE_PROJECT_NAME:?set a unique e2e project name}
services:
  postgres:
    image: ${POSTGRES_E2E_IMAGE:?set a digest-pinned PostgreSQL image}
    environment:
      POSTGRES_DB: airborne
      POSTGRES_USER: airborne
      POSTGRES_PASSWORD: airborne-e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airborne -d airborne"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs: [/var/lib/postgresql/data]
    volumes:
      - ./fixtures/000_create_app_role.sql:/docker-entrypoint-initdb.d/000_create_app_role.sql:ro
      - ../migrations/001_baseline.sql:/docker-entrypoint-initdb.d/001_baseline.sql:ro
    labels: ["com.ai8future.airborne.e2e=true"]

  redis:
    image: ${REDIS_E2E_IMAGE:?set a digest-pinned Redis image}
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs: [/data]
    labels: ["com.ai8future.airborne.e2e=true"]

  provider-stub:
    build: ./stub
    environment:
      STUB_SEED: "e2e-fixed-seed"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8080/healthz')"]
      interval: 2s
      timeout: 2s
      retries: 15
    labels: ["com.ai8future.airborne.e2e=true"]

  airborne:
    image: ${AIRBORNE_E2E_IMAGE:?set the tested Airborne image reference}
    environment:
      AIRBORNE_CONFIG: /e2e/airborne.yaml
      AIRBORNE_ADMIN_TOKEN: airborne-e2e-token
      AIRBORNE_AUTH_MODE: static
      ADMIN_ENABLED: "true"
      DATABASE_ENABLED: "true"
      DATABASE_URL: postgres://airborne_app:airborne-app-e2e@postgres:5432/airborne?sslmode=disable
      AIRBORNE_STARTUP_MODE: development
      AIRBORNE_CONFIGS_DIR: /e2e/configs
      OPENAI_API_KEY: deterministic-e2e-key
      SSL_CERT_FILE: /e2e/provider-stub-ca.pem
      AIRBORNE_E2E_ALLOW_PROVIDER_STUB: "true"
      AIRBORNE_USE_FROZEN: "true"
      AIRBORNE_FROZEN_CONFIG_PATH: /e2e/frozen.json
    volumes:
      - ./fixtures/airborne.yaml:/e2e/airborne.yaml:ro
      - ./fixtures/configs:/e2e/configs:ro
      - ./stub/certs/provider-stub-cert.pem:/e2e/provider-stub-ca.pem:ro
      - ${AIRBORNE_E2E_FROZEN_CONFIG:?set the generated frozen config path}:/e2e/frozen.json:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      provider-stub: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/app/airborne", "--health-check"]
      interval: 2s
      timeout: 3s
      retries: 30
    labels: ["com.ai8future.airborne.e2e=true"]

  dashboard:
    build: ../dashboard
    environment:
      AIRBORNE_ADMIN_URL: http://airborne:8473
      AIRBORNE_ADMIN_TOKEN: airborne-e2e-token
      AIRBORNE_DEFAULT_PROVIDER: openai
      DASHBOARD_ADMIN_TOKEN: dashboard-e2e-token
    depends_on:
      airborne: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4848').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
    labels: ["com.ai8future.airborne.e2e=true"]

# The deterministic provider is the only runtime provider available to the
# stack. The runner reaches bridge addresses directly while this internal
# network denies containers a route to live provider endpoints.
networks:
  default:
    internal: true
